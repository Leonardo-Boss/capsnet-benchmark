main:
  seed: 22
  cuda: True
  verbosity: 0  # 0: debug, 1: info, 2: warning, 3: error

data_loader:
  type: 'Cifar10DataLoader'
  args: # see utils/data_loader.py
    data_dir: '../'  # parent dir containing the cifar-10-batches-py folder
    batch_size: 16
    shuffle: True
    validation_split: 0.1
    clean_validation: True  # validate / select checkpoints on un-augmented images
    num_workers: 1
    augmentation: 'none'  # 'none' | 'standard' | 'strong'

optimizer:
  type: 'AdamW'
  # args: # see torch.optim
  #   lr: 5.e-4
lr_scheduler:
  type: 'ExponentialLR'
  args: # see torch.optim.lr_scheduler
    gamma: 0.9604

metrics: # see model/metrics.py
  - 'accuracy'

trainer:
  epochs: 50
  log_step: 1700  # log data every x step
  save_dir: 'saved_v2/'  # new dir: train.py RESUMES from any ep*.pth it finds in the run dir
  save_period: 10  # save model every x epoch
  verbosity: 0  # see main.verbosity
  monitor: 'min val_loss'  # '{min|max} {metrics}'
  early_stop: -5  # stop after x epoch not improving negative for no early stop
  tensorboard: True

logger:  # global logger config
  version: 1
  disable_existing_loggers: False
  formatters:
    brief:
      format: '%(message)s'
    precise:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
  handlers:
    console:  # configure output logs to console
      class: 'logging.StreamHandler'
      level: 'DEBUG'
      formatter: 'brief'
      stream: 'ext://sys.stdout'
    file:  # write logs to a file
      class: 'logging.handlers.RotatingFileHandler'
      level: 'INFO'
      formatter: 'precise'
      filename: 'info.log'
      maxBytes: 1.e+6
      backupCount: 5
      encoding: 'utf8'
  root:  # new logger object will inherit from this
    level: 'INFO'
    handlers:
      - 'console'
      - 'file'
